<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmos Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0b0b16" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2"/>

  <!-- Celestial Orbit Rings -->
  <ellipse cx="100" cy="100" rx="75" ry="30" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="75" ry="30" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" transform="rotate(45 100 100)"/>

  <!-- Central Pulsing Golden Star -->
  <circle cx="100" cy="100" r="22" fill="url(#grad1)" filter="url(#glow)"/>

  <!-- Star Rays -->
  <path d="M 100 45 L 105 85 L 145 90 L 105 95 L 100 135 L 95 95 L 55 90 L 95 85 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="145" cy="90" r="3" fill="#38bdf8"/>
  <circle cx="55" cy="90" r="2.5" fill="#c084fc"/>
  <circle cx="100" cy="45" r="3" fill="#fbbf24"/>
  <circle cx="100" cy="135" r="2.5" fill="#f43f5e"/>
</svg>
